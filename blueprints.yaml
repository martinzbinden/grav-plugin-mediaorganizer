name: Media Organizer
slug: mediaorganizer
type: plugin
version: 1.2.0
description: 'Datei-Browser für die Mediathek (user/media) im Admin2: Ordnerbaum, Galerie und Liste, Vorschau, Herunterladen einzeln oder als ZIP, Texte und EXIF (WebP/JPEG) bearbeiten, Bilder optimieren, wiederherstellen und automatisch in ein Standardformat (WebP, JPEG, AVIF) umwandeln.'
icon: images
author:
  name: Martin Zbinden
license: MIT
dependencies:
  - { name: grav, version: '>=2.0.0' }
  - { name: api, version: '>=1.0.0' }
  - { name: admin2, version: '>=2.0.0' }

form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: Plugin aktiv
      highlight: 1
      default: 1
      options: { 1: Ja, 0: Nein }
      validate: { type: bool }
    titel:
      type: text
      label: Name in der Seitenleiste
      default: Medienarchiv
    icon:
      type: text
      label: Symbol (Font Awesome)
      default: fa-images
    prioritaet:
      type: number
      label: Position in der Seitenleiste (kleiner = weiter oben)
      default: 5
    ausblenden:
      type: array
      label: Ausgeblendete Ordner
      value_only: true
      help: 'Ordnernamen, die nicht erscheinen (Sicherungen in _original sind immer ausgeblendet).'
    zip_praefix:
      type: text
      label: Präfix für ZIP-Dateien
      placeholder: 'leer = Hostname'
    konvertierung_titel:
      type: section
      title: Konvertierung
      text: 'Bilder, die im Admin in die Mediathek hochgeladen werden oder in einem geöffneten Ordner liegen, werden ins Zielformat umgewandelt. Die Ausrichtung wird korrigiert, EXIF-Daten, Titel und Sortierung bleiben erhalten. Im Medienarchiv lassen sich einzelne Bilder auch von Hand umwandeln.'
    konvertierung.aktiv:
      type: toggle
      label: Automatisch umwandeln
      default: 0
      options: { 1: Ja, 0: Nein }
      validate: { type: bool }
    konvertierung.zielformat:
      type: select
      label: Zielformat
      default: webp
      options:
        webp: 'WebP (empfohlen: klein, mit Transparenz)'
        jpg: 'JPEG (überall lesbar; transparente Bilder bleiben unverändert)'
        avif: 'AVIF (sehr klein; nur wenn der Server es unterstützt, ohne EXIF)'
    konvertierung.quellformate:
      type: checkboxes
      label: Diese Formate umwandeln
      use: keys
      default: { jpg: true, png: true }
      options:
        jpg: JPEG
        png: PNG
        webp: WebP
        gif: 'GIF (nur erstes Bild)'
    konvertierung.qualitaet:
      type: range
      label: Qualität
      default: 90
      validate: { min: 40, max: 100, step: 1 }
    konvertierung.png_verlustfrei:
      type: toggle
      label: PNG verlustfrei nach WebP
      default: 1
      options: { 1: Ja, 0: Nein }
      validate: { type: bool }
    konvertierung.max_pixel:
      type: number
      label: 'Maximale Pixel (darüber: Original in _original, Arbeitsdatei verkleinert)'
      default: 25000000
    verlauf_titel:
      type: section
      title: Verlauf und Sicherung
      text: 'Vor jeder Änderung (Umwandeln, Optimieren, Umbenennen, Papierkorb, Texte, angepasste Seiten) werden die betroffenen Dateien gesichert. Im Medienarchiv unter «Verlauf» lässt sich jeder Vorgang rückgängig machen. Ablage: user/data/mediaorganizer/verlauf.'
    verlauf.tage:
      type: number
      label: Sicherungen aufbewahren (Tage)
      default: 60
      validate: { min: 1 }
    verlauf.max_mb:
      type: number
      label: Höchstens (MB, älteste werden zuerst entfernt)
      default: 1000
      validate: { min: 10 }
